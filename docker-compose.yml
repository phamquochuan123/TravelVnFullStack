services:

  # ─── MySQL ───────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: travel_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: travelmanager
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_PWD: ${DB_PASSWORD}
    # Không public port MySQL ra host nữa — chỉ backend mới cần gọi qua network nội bộ docker-compose.
    # (Nếu cần truy cập DB từ máy host để debug, dùng `docker exec -it travel_db mysql -u root` thay vì mở port.)
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot ─────────────────────────────────────────
  backend:
    build:
      context: ./travel
      dockerfile: Dockerfile
    container_name: travel_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Override datasource URL để dùng service name 'db' thay vì localhost
      # connectionTimeZone=UTC: giữ nguyên ngữ nghĩa lưu trữ thời gian của DB, độc lập
      # với giờ mặc định của JVM (app đặt Asia/Ho_Chi_Minh cho nghiệp vụ).
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/travelmanager?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&preserveInstants=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      GOOGLE_API_CLIENT_ID: ${GOOGLE_API_CLIENT_ID}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      # Bắt buộc phải liệt kê ở đây. Image không chứa file .env (Dockerfile chỉ copy source),
      # nên biến nào không khai trong khối này thì trong container là RỖNG — và vì
      # application.properties dùng dạng ${VAR:} có giá trị mặc định rỗng, app vẫn khởi động
      # bình thường rồi im lặng gọi API với apikey trống.
      OPENTRIPMAP_API_KEY: ${OPENTRIPMAP_API_KEY:-}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    # Backend chạy port 8081 (đúng với application.properties) — không expose ra ngoài,
    # chỉ frontend (nginx) mới cần gọi tới qua network nội bộ của docker-compose
    expose:
      - "8081"

  # ─── React Frontend ──────────────────────────────────────
  frontend:
    build:
      context: "./react travel manager"
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: travel_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Không public port ra host — Caddy sẽ đứng trước, tự lo HTTPS.
    # Container chạy non-root (nginxinc/nginx-unprivileged) nên nginx listen 8080, không phải 80.
    expose:
      - "8080"

  # ─── Cloudflare Quick Tunnel: public URL tạm, không cần domain ─
  # URL sinh ra ngẫu nhiên (*.trycloudflare.com), xem bằng `docker compose logs -f cloudflared`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: travel_cloudflared
    restart: unless-stopped
    # --protocol http2: mặc định cloudflared đi bằng QUIC (UDP). Đường mạng ở đây làm
    # rớt UDP liên tục — log cũ có 76 lần "control stream encountered a failure" và 22
    # lần "Failed to dial a quic connection". Mỗi lần rớt là cloudflared khởi động lại
    # và Quick Tunnel sinh hostname MỚI, nên link public đổi vài phút một lần (7 lần
    # trong một buổi). HTTP/2 chạy trên TCP nên không dính chuyện UDP bị bóp.
    command: tunnel --no-autoupdate --protocol http2 --url http://frontend:8080
    depends_on:
      - frontend

  # ─── Caddy: reverse proxy + tự động HTTPS (Let's Encrypt) ─
  # TẮT khi còn dùng Cloudflare Quick Tunnel: cloudflared trỏ thẳng vào frontend:8080
  # nên traffic public KHÔNG đi qua Caddy — service này chỉ giữ port 80/443 cho một
  # hostname chưa tồn tại (Caddyfile vẫn là placeholder YOUR_SERVER_IP.nip.io) và sẽ
  # liên tục xin cert thất bại. Security header đã chuyển vào react travel manager/nginx.conf.
  #
  # BẬT LẠI khi đã có domain/VPS thật: thay YOUR_SERVER_IP trong Caddyfile bằng IP thật,
  # bỏ comment khối dưới, và bỏ service cloudflared đi.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: travel_caddy
  #   restart: unless-stopped
  #   depends_on:
  #     - frontend
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #     - caddy_config:/config

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
